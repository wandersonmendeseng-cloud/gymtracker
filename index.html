<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#090d16">
<title>GymTracker 3.0</title>
<style>
:root{--bg:#090d16;--card:#131c2e;--line:#1e293b;--mut:#94a3b8;--txt:#f8fafc;--blue:#3b82f6;--green:#10b981;--amber:#f59e0b;--rose:#f43f5e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Roboto,sans-serif}
body{max-width:460px;margin:0 auto;min-height:100vh;padding-bottom:110px;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer}
button:active{transform:scale(.96)}
input,textarea,select{font:inherit;color:var(--txt);background:#060a12;border:1px solid #334155;border-radius:12px;padding:10px;width:100%;outline:none;user-select:text;-webkit-user-select:text}
input:focus,textarea:focus,select:focus{border-color:var(--blue)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
header{position:sticky;top:0;z-index:30;background:rgba(15,23,42,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{margin:0;font-size:18px;font-weight:800;background:linear-gradient(90deg,#60a5fa,#34d399);-webkit-background-clip:text;background-clip:text;color:transparent}
#dia-sugerido{margin:2px 0 0;font-size:11px;color:var(--mut)}
.timer{background:rgba(15,23,42,.9);border:1px solid var(--line);border-radius:12px;padding:6px 10px;text-align:right}
.timer .row{display:flex;gap:8px;align-items:center;justify-content:flex-end}
.timer small{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:600}
#timer-display{font-size:17px;font-weight:700;color:var(--green)}
#timer-display.fim{color:var(--rose)}
.tbtns{display:flex;gap:4px;margin-top:4px;justify-content:flex-end}
.tbtns button{font-size:10px;font-weight:600;padding:3px 8px;border-radius:6px;background:#1e293b;border:1px solid #334155;color:#cbd5e1}
.tbtns .x{background:rgba(76,5,25,.6);border-color:#9f1239;color:#fda4af}
main{padding:14px 14px 0}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{flex:1;padding:9px 4px;border-radius:12px;font-weight:700;font-size:12px;background:#131c2e;color:var(--mut);border:1px solid var(--line)}
.tab span{display:block;font-size:10px;font-weight:400;opacity:.8}
.tab.on{background:var(--blue);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(37,99,235,.3)}
.novo{padding:8px 13px;border-radius:12px;background:#059669;color:#fff;font-weight:700;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.novo b{font-size:18px;line-height:1}
.legenda{display:flex;justify-content:space-between;align-items:center;background:rgba(15,23,42,.7);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:14px;font-size:11px;color:var(--mut);gap:6px;flex-wrap:wrap}
.tag{display:inline-block;padding:1px 6px;border-radius:5px;font-weight:700;border:1px solid}
.tW{background:rgba(245,158,11,.18);color:#fbbf24;border-color:rgba(245,158,11,.35)}
.tT{background:rgba(59,130,246,.18);color:#60a5fa;border-color:rgba(59,130,246,.35)}
.tF{background:rgba(244,63,94,.18);color:#fb7185;border-color:rgba(244,63,94,.35)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 20px -2px rgba(0,0,0,.35);padding:14px;margin-bottom:14px}
.ex-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ex-nome{font-weight:700;font-size:14px}
.ex-meta{font-size:11px;color:var(--mut);margin-top:2px}
.ex-meta b{color:#34d399}
.mini{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:4px 8px;font-size:11px;color:#cbd5e1}
.mini.r{color:#fda4af}
.ajuste{margin-top:8px;font-size:11px;color:#fbbf24;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);border-radius:10px;padding:6px 9px}
.guia{margin-top:8px;font-size:11.5px;line-height:1.45;color:#cbd5e1;background:#0f172a;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.ultima{margin-top:8px;font-size:11px;color:var(--mut)}
.ultima b{color:#e2e8f0}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.chip{font-size:11px;padding:3px 7px;border-radius:8px;border:1px solid}
.reg{display:grid;grid-template-columns:48px 1fr 1fr 78px;gap:6px;margin-top:10px;align-items:center}
.reg input{text-align:center;padding:9px 4px}
.tipo{height:100%;min-height:40px;border-radius:12px;font-weight:800;font-size:15px;border:1px solid}
.ok{background:var(--green);color:#fff;border-radius:12px;font-weight:700;font-size:12px;min-height:40px}
.prog{height:5px;background:#0f172a;border-radius:9px;margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,#10b981)}
section.an{margin-top:30px}
section.an h2{margin:0;font-size:14px}
section.an p{margin:2px 0 10px;font-size:11px;color:var(--mut)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#0f172a;padding:4px;border-radius:12px;border:1px solid var(--line);margin:10px 0}
.seg button{padding:7px;border-radius:9px;font-size:12px;font-weight:700;background:transparent;color:var(--mut)}
.seg button.on{background:var(--blue);color:#fff}
.chartbox{background:rgba(2,6,15,.6);border:1px solid var(--line);border-radius:12px;padding:6px}
canvas{width:100%;height:200px;display:block}
.hist{max-height:190px;overflow-y:auto;margin-top:8px}
.hrow{display:flex;justify-content:space-between;font-size:11.5px;padding:6px 9px;background:#0f172a;border:1px solid var(--line);border-radius:9px;margin-bottom:5px}
.hh{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.hh h3{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#cbd5e1}
.link{background:none;color:#fb7185;font-size:11px;text-decoration:underline}
.vazio{text-align:center;color:var(--mut);font-size:12px;padding:22px 8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.on{display:flex}
.box{background:#0f172a;border:1px solid #334155;border-radius:18px;padding:18px;width:100%;max-width:380px;max-height:90vh;overflow-y:auto}
.box h3{margin:0 0 12px;font-size:16px}
.box label{display:block;font-size:11px;font-weight:600;color:#cbd5e1;margin:10px 0 4px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.btn{padding:10px 16px;border-radius:12px;font-weight:700;font-size:12px;background:#1e293b;color:#cbd5e1}
.btn.p{background:var(--blue);color:#fff}
.btn.d{background:#e11d48;color:#fff}
#toast{position:fixed;top:78px;left:50%;transform:translateX(-50%);z-index:60;display:none;color:#fff;font-size:12px;font-weight:700;padding:9px 16px;border-radius:99px;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:90%;text-align:center}
</style>
</head>
<body>

<div id="toast"></div>

<header>
  <div>
    <h1>GymTracker 3.0</h1>
    <p id="dia-sugerido"></p>
  </div>
  <div class="timer">
    <div class="row"><small>Descanso</small><span id="timer-display" class="mono">01:30</span></div>
    <div class="tbtns">
      <button onclick="iniciarTimer(60)">60s</button>
      <button onclick="iniciarTimer(90)">90s</button>
      <button onclick="iniciarTimer(120)">120s</button>
      <button class="x" onclick="pararTimer()">✕</button>
    </div>
  </div>
</header>

<main>
  <div class="tabs">
    <button class="tab" id="tab-A" onclick="selecionarTreino('A')">Treino A<span>Push</span></button>
    <button class="tab" id="tab-B" onclick="selecionarTreino('B')">Treino B<span>Pull</span></button>
    <button class="tab" id="tab-C" onclick="selecionarTreino('C')">Treino C<span>Legs</span></button>
    <button class="novo" onclick="abrirModalExercicio()"><b>+</b>Novo</button>
  </div>

  <div class="legenda">
    <b style="color:#cbd5e1">Tipo de série (toque para trocar):</b>
    <span><span class="tag tW">W</span> Aquec.</span>
    <span><span class="tag tT">T</span> Trabalho</span>
    <span><span class="tag tF">F</span> Falha</span>
  </div>

  <div id="titulo-treino" style="font-size:12px;font-weight:700;color:#cbd5e1;margin-bottom:10px"></div>
  <div id="lista-exercicios"></div>

  <section class="card an">
    <h2>📈 Evolução &amp; Força (Epley)</h2>
    <p>Considera apenas séries de Trabalho e Falha</p>
    <select id="select-grafico" onchange="atualizarGrafico()"></select>
    <div class="seg">
      <button id="btn-metric-carga" class="on" onclick="mudarMetricaGrafico('carga')">Carga Bruta (kg)</button>
      <button id="btn-metric-rm" onclick="mudarMetricaGrafico('1rm')">1RM Estimado (kg)</button>
    </div>
    <div class="chartbox"><canvas id="graficoProgressao"></canvas></div>
    <div class="hh">
      <h3>Histórico recente</h3>
      <button class="link" onclick="limparUltimoRegistroExercicio()">Desfazer última série</button>
    </div>
    <div id="tabela-historico-exercicio" class="hist"></div>
  </section>

  <section class="card" style="margin-top:14px">
    <h2 style="margin:0 0 8px;font-size:14px">💾 Backup</h2>
    <div style="display:flex;gap:8px">
      <button class="btn" style="flex:1" onclick="exportarDados()">Exportar</button>
      <button class="btn" style="flex:1" onclick="document.getElementById('arq-import').click()">Importar</button>
      <input type="file" id="arq-import" accept="application/json" style="display:none" onchange="importarDados(event)">
    </div>
  </section>
</main>

<!-- Modal exercício -->
<div id="modal-ex" class="modal">
  <div class="box">
    <h3 id="modal-titulo">Novo Exercício</h3>
    <input type="hidden" id="edit-id">
    <label>Nome do exercício *</label>
    <input type="text" id="ex-nome" placeholder="Ex: Supino Inclinado no Smith">
    <div class="g3">
      <div><label>Nº séries</label><input type="number" inputmode="numeric" id="ex-num-series" placeholder="4" min="1" max="15" class="mono" style="text-align:center"></div>
      <div><label>Reps mín</label><input type="number" inputmode="numeric" id="ex-reps-min" placeholder="8" min="1" max="50" class="mono" style="text-align:center"></div>
      <div><label>Reps máx</label><input type="number" inputmode="numeric" id="ex-reps-max" placeholder="12" min="1" max="50" class="mono" style="text-align:center"></div>
    </div>
    <label style="color:#fbbf24">⚙️ Ajuste do aparelho</label>
    <input type="text" id="ex-ajuste" placeholder="Ex: Banco furo 4, pegada pronada">
    <label>📘 Guia de execução / notas</label>
    <textarea id="ex-explicacao" rows="3" placeholder="Ex: Escápulas retraídas, descida em 2 segundos."></textarea>
    <div class="acts">
      <button class="btn" onclick="fecharModal()">Cancelar</button>
      <button class="btn p" onclick="salvarExercicioFicha()">Salvar</button>
    </div>
  </div>
</div>

<!-- Modal confirmação -->
<div id="modal-confirm" class="modal">
  <div class="box" style="max-width:300px;text-align:center">
    <h3>Remover exercício?</h3>
    <p style="font-size:12px;color:var(--mut);margin:0 0 14px">Ele sai desta ficha, mas o histórico salvo permanece.</p>
    <div class="acts" style="justify-content:center">
      <button class="btn" onclick="fecharConfirm()">Cancelar</button>
      <button class="btn d" id="btn-confirm-yes">Sim, remover</button>
    </div>
  </div>
</div>

<script>
// ============================ DADOS ============================
const fichaPadrao = {
  A:{titulo:"Treino A — Empurrar (Peito, Ombro e Tríceps)",exercicios:[
    {id:"supino_reto",nome:"Supino Reto com Barra",numSeries:4,repsMin:8,repsMax:10,ajuste:"Suporte da barra na altura 6 • Pés firmes no solo",explicacao:"Retraia e deprima as escápulas no banco. Desça a barra até a linha inferior do peitoral com os cotovelos a cerca de 45° do tronco."},
    {id:"desenv_halter",nome:"Desenvolvimento com Halteres",numSeries:3,repsMin:10,repsMax:12,ajuste:"Banco inclinado a 75° (furo 7)",explicacao:"Suba os halteres no plano escapular mantendo o core firme, sem hiperestender a lombar."},
    {id:"triceps_corda",nome:"Tríceps Pulley na Corda",numSeries:4,repsMin:12,repsMax:15,ajuste:"Polia no pino mais alto • 1 passo atrás",explicacao:"Cotovelos fixos ao lado das costelas. Estenda por completo e abra a corda no final."}]},
  B:{titulo:"Treino B — Puxar (Costas, Posterior e Bíceps)",exercicios:[
    {id:"puxada_frente",nome:"Puxada Alta Aberta (Pulldown)",numSeries:4,repsMin:8,repsMax:12,ajuste:"Trava dos joelhos no furo 3 • Pegada pronada aberta",explicacao:"Inicie deprimindo as escápulas. Puxe a barra até a parte alta do peito, cotovelos em direção ao quadril."},
    {id:"remada_baixa",nome:"Remada Baixa no Triângulo",numSeries:4,repsMin:8,repsMax:10,ajuste:"Pés na plataforma intermediária • Triângulo fechado",explicacao:"Alongue os dorsais sem curvar a lombar e puxe até o abdômen, juntando as escápulas."},
    {id:"rosca_direta",nome:"Rosca Direta na Barra W",numSeries:3,repsMin:10,repsMax:12,ajuste:"Pegada supinada na angulação interna da barra W",explicacao:"Sem roubar com o quadril. Controle a descida contando 2 segundos."}]},
  C:{titulo:"Treino C — Pernas Completo (Lower Body)",exercicios:[
    {id:"agachamento",nome:"Agachamento Livre / Hack",numSeries:4,repsMin:6,repsMax:10,ajuste:"Barra na linha do trapézio médio • Pés na largura do quadril",explicacao:"Trave o abdômen, alinhe joelhos com a ponta dos pés e desça quebrando a paralela com coluna neutra."},
    {id:"leg_press",nome:"Leg Press 45°",numSeries:4,repsMin:10,repsMax:12,ajuste:"Encosto no nível 2 • Pés no centro da plataforma",explicacao:"Desça até máxima flexão sem descolar o quadril do banco. Não tranque os joelhos no topo."},
    {id:"mesa_flexora",nome:"Mesa Flexora",numSeries:4,repsMin:12,repsMax:15,ajuste:"Rolo no tornozelo furo 4 • Apoio alinhado ao joelho",explicacao:"Mantenha o quadril contra o estofado durante toda a subida para isolar os posteriores."}]}
};

function lerLS(chave, padrao){ try{ const v = JSON.parse(localStorage.getItem(chave)); return v ?? padrao; }catch(e){ return padrao; } }
function salvarLS(chave, valor){ try{ localStorage.setItem(chave, JSON.stringify(valor)); }catch(e){ mostrarToast('Não foi possível salvar os dados', 'background:#e11d48'); } }

let fichaTreino = lerLS('gym_ficha_v3', null) || JSON.parse(JSON.stringify(fichaPadrao));
let historico   = lerLS('gym_hist_v3', []);   // {exId, ts, peso, reps, tipo}
let treinoAtual = 'A';
let timerInterval = null, timerRestante = 90, ultimoTimer = 90;
let metricaGrafico = 'carga';
let tipoSelecionado = {};     // exId -> W/T/F
let abertos = {};             // exId -> guia visível
let idParaRemover = null;

// ============================ UTILS ============================
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (Math.round(n*10)/10).toString().replace('.', ',');
const epley = (peso, reps) => reps <= 1 ? peso : peso * (1 + reps/30);
const mesmoDia = (a,b) => new Date(a).toDateString() === new Date(b).toDateString();
const dataCurta = ts => new Date(ts).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
const ehValida = h => h.tipo === 'T' || h.tipo === 'F';

let toastT = null;
function mostrarToast(msg, estilo='background:#2563eb'){
  const t = $('toast'); t.style.cssText = estilo; t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastT); toastT = setTimeout(()=>t.style.display='none', 2200);
}

function todosExercicios(){
  const mapa = {};
  Object.values(fichaTreino).forEach(t => t.exercicios.forEach(e => mapa[e.id] = e));
  return Object.values(mapa);
}
function nomePorId(id){
  const e = todosExercicios().find(x => x.id === id);
  return e ? e.nome : (historico.find(h=>h.exId===id)?.nome || id);
}

// ============================ TIMER ============================
function fmtTimer(s){ return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); }
function bipe(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0,0.25,0.5].forEach(d => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.2, ctx.currentTime + d); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + d + 0.2);
      o.start(ctx.currentTime + d); o.stop(ctx.currentTime + d + 0.22);
    });
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate([300,150,300,150,300]); }catch(e){}
}
function iniciarTimer(seg){
  clearInterval(timerInterval);
  ultimoTimer = seg; timerRestante = seg;
  const fim = Date.now() + seg*1000;
  $('timer-display').classList.remove('fim');
  $('timer-display').textContent = fmtTimer(seg);
  timerInterval = setInterval(() => {
    timerRestante = Math.max(0, Math.ceil((fim - Date.now())/1000));
    $('timer-display').textContent = fmtTimer(timerRestante);
    if(timerRestante <= 0){
      clearInterval(timerInterval); timerInterval = null;
      $('timer-display').classList.add('fim'); bipe();
      mostrarToast('⏱ Descanso finalizado!', 'background:#059669');
    }
  }, 250);
}
function pararTimer(){
  clearInterval(timerInterval); timerInterval = null;
  $('timer-display').classList.remove('fim');
  $('timer-display').textContent = fmtTimer(ultimoTimer);
}

// ============================ TREINOS ============================
function diaSugerido(){
  const d = new Date().getDay(); // 0=dom
  const mapa = {1:'A',2:'B',3:'C',4:'A',5:'B',6:'C',0:'A'};
  const nomes = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
  return {letra: mapa[d], texto: nomes[d] + (d===0 ? ' • descanso (sugestão: Treino A)' : ' • sugestão: Treino ' + mapa[d])};
}
function selecionarTreino(letra){
  treinoAtual = letra;
  ['A','B','C'].forEach(l => $('tab-'+l).classList.toggle('on', l === letra));
  $('titulo-treino').textContent = fichaTreino[letra].titulo;
  renderizarExercicios();
}

function renderizarExercicios(){
  const lista = $('lista-exercicios');
  const exs = fichaTreino[treinoAtual].exercicios;
  if(!exs.length){ lista.innerHTML = '<div class="vazio">Nenhum exercício neste treino.<br>Toque em “+ Novo” para adicionar.</div>'; return; }
  const agora = Date.now();
  lista.innerHTML = exs.map(ex => {
    const tipo = tipoSelecionado[ex.id] || 'T';
    const hoje = historico.filter(h => h.exId === ex.id && mesmoDia(h.ts, agora));
    const anteriores = historico.filter(h => h.exId === ex.id && !mesmoDia(h.ts, agora) && ehValida(h));
    let ultima = '';
    if(anteriores.length){
      const dia = anteriores[anteriores.length-1].ts;
      const doDia = anteriores.filter(h => mesmoDia(h.ts, dia));
      const melhor = doDia.reduce((a,b)=> b.peso*b.reps > a.peso*a.reps ? b : a);
      ultima = `<div class="ultima">Último treino (${dataCurta(dia)}): <b>${fmt(melhor.peso)} kg × ${melhor.reps}</b></div>`;
    }
    const validas = hoje.filter(ehValida).length;
    const pct = Math.min(100, Math.round(validas / Math.max(1, ex.numSeries) * 100));
    const chips = hoje.map(h => `<span class="chip t${h.tipo}">${h.tipo} · ${fmt(h.peso)}kg × ${h.reps}</span>`).join('');
    const ref = hoje.length ? hoje[hoje.length-1] : (anteriores.length ? anteriores[anteriores.length-1] : null);
    return `
    <div class="card">
      <div class="ex-head">
        <div>
          <div class="ex-nome">${esc(ex.nome)}</div>
          <div class="ex-meta"><b>${ex.numSeries} séries</b> • ${ex.repsMin}–${ex.repsMax} reps (meta ${ex.repsMax})</div>
        </div>
        <div style="display:flex;gap:5px;flex-shrink:0">
          <button class="mini" onclick="alternarGuia('${ex.id}')">📘</button>
          <button class="mini" onclick="abrirModalExercicio('${ex.id}')">✎</button>
          <button class="mini r" onclick="pedirRemocao('${ex.id}')">🗑</button>
        </div>
      </div>
      ${ex.ajuste ? `<div class="ajuste">⚙️ ${esc(ex.ajuste)}</div>` : ''}
      ${abertos[ex.id] && ex.explicacao ? `<div class="guia">${esc(ex.explicacao)}</div>` : ''}
      ${ultima}
      <div class="prog"><i style="width:${pct}%"></i></div>
      <div class="ex-meta" style="margin-top:4px">${validas}/${ex.numSeries} séries válidas hoje</div>
      ${chips ? `<div class="chips">${chips}</div>` : ''}
      <div class="reg">
        <button class="tipo t${tipo}" onclick="alternarTipo('${ex.id}')">${tipo}</button>
        <input type="number" inputmode="decimal" step="0.5" min="0" placeholder="kg" class="mono" id="peso-${ex.id}" value="${ref ? ref.peso : ''}">
        <input type="number" inputmode="numeric" min="1" placeholder="reps" class="mono" id="reps-${ex.id}">
        <button class="ok" onclick="registrarSerie('${ex.id}')">✓ Salvar</button>
      </div>
    </div>`;
  }).join('');
}

function alternarTipo(id){
  const ordem = ['W','T','F'];
  const atual = tipoSelecionado[id] || 'T';
  const pesoV = $('peso-'+id)?.value, repsV = $('reps-'+id)?.value;
  tipoSelecionado[id] = ordem[(ordem.indexOf(atual)+1) % 3];
  renderizarExercicios();
  if($('peso-'+id)) $('peso-'+id).value = pesoV;
  if($('reps-'+id)) $('reps-'+id).value = repsV;
}
function alternarGuia(id){
  const pesoV = $('peso-'+id)?.value, repsV = $('reps-'+id)?.value;
  abertos[id] = !abertos[id];
  renderizarExercicios();
  if($('peso-'+id)) $('peso-'+id).value = pesoV;
  if($('reps-'+id)) $('reps-'+id).value = repsV;
}

function registrarSerie(id){
  const peso = parseFloat(($('peso-'+id).value || '').replace(',', '.'));
  const reps = parseInt($('reps-'+id).value, 10);
  if(!(peso >= 0) || isNaN(peso)){ mostrarToast('Informe a carga em kg', 'background:#e11d48'); return; }
  if(!(reps >= 1)){ mostrarToast('Informe as repetições', 'background:#e11d48'); return; }
  const tipo = tipoSelecionado[id] || 'T';
  historico.push({exId:id, nome:nomePorId(id), ts:Date.now(), peso, reps, tipo});
  salvarLS('gym_hist_v3', historico);
  const ex = todosExercicios().find(e => e.id === id);
  let msg = `Série registrada: ${fmt(peso)} kg × ${reps}`;
  if(ex && ehValida({tipo}) && reps >= ex.repsMax) msg += ' 🎯 meta batida — considere subir a carga!';
  mostrarToast(msg, 'background:#059669');
  iniciarTimer(tipo === 'W' ? 60 : (ultimoTimer || 90));
  renderizarExercicios();
  popularSelectGrafico(id);
  atualizarGrafico();
}

// ============================ MODAL EXERCÍCIO ============================
function abrirModalExercicio(id){
  const ex = id ? fichaTreino[treinoAtual].exercicios.find(e => e.id === id) : null;
  $('modal-titulo').textContent = ex ? 'Editar Exercício' : 'Novo Exercício';
  $('edit-id').value = ex ? ex.id : '';
  $('ex-nome').value = ex?.nome || '';
  $('ex-num-series').value = ex?.numSeries || '';
  $('ex-reps-min').value = ex?.repsMin || '';
  $('ex-reps-max').value = ex?.repsMax || '';
  $('ex-ajuste').value = ex?.ajuste || '';
  $('ex-explicacao').value = ex?.explicacao || '';
  $('modal-ex').classList.add('on');
}
function fecharModal(){ $('modal-ex').classList.remove('on'); }
function salvarExercicioFicha(){
  const nome = $('ex-nome').value.trim();
  if(!nome){ mostrarToast('Dê um nome ao exercício', 'background:#e11d48'); return; }
  let numSeries = parseInt($('ex-num-series').value,10) || 3;
  let repsMin = parseInt($('ex-reps-min').value,10) || 8;
  let repsMax = parseInt($('ex-reps-max').value,10) || 12;
  if(repsMin > repsMax) [repsMin, repsMax] = [repsMax, repsMin];
  const dados = {nome, numSeries, repsMin, repsMax, ajuste:$('ex-ajuste').value.trim(), explicacao:$('ex-explicacao').value.trim()};
  const editId = $('edit-id').value;
  const lista = fichaTreino[treinoAtual].exercicios;
  if(editId){
    const ex = lista.find(e => e.id === editId);
    Object.assign(ex, dados);
  } else {
    lista.push({id:'ex_' + Date.now().toString(36), ...dados});
  }
  salvarLS('gym_ficha_v3', fichaTreino);
  fecharModal();
  renderizarExercicios();
  popularSelectGrafico();
  atualizarGrafico();
  mostrarToast(editId ? 'Exercício atualizado' : 'Exercício adicionado', 'background:#059669');
}
function pedirRemocao(id){
  idParaRemover = id;
  $('btn-confirm-yes').onclick = () => {
    const t = fichaTreino[treinoAtual];
    t.exercicios = t.exercicios.filter(e => e.id !== idParaRemover);
    salvarLS('gym_ficha_v3', fichaTreino);
    fecharConfirm(); renderizarExercicios(); popularSelectGrafico(); atualizarGrafico();
    mostrarToast('Exercício removido', 'background:#475569');
  };
  $('modal-confirm').classList.add('on');
}
function fecharConfirm(){ $('modal-confirm').classList.remove('on'); }

// ============================ GRÁFICO ============================
function popularSelectGrafico(manter){
  const sel = $('select-grafico');
  const anterior = manter || sel.value;
  const ids = new Set(todosExercicios().map(e => e.id));
  historico.forEach(h => ids.add(h.exId));
  sel.innerHTML = [...ids].map(id => `<option value="${esc(id)}">${esc(nomePorId(id))}</option>`).join('');
  if([...ids].includes(anterior)) sel.value = anterior;
}
function mudarMetricaGrafico(m){
  metricaGrafico = m;
  $('btn-metric-carga').classList.toggle('on', m === 'carga');
  $('btn-metric-rm').classList.toggle('on', m === '1rm');
  atualizarGrafico();
}
function pontosDoExercicio(id){
  const porDia = new Map();
  historico.filter(h => h.exId === id && ehValida(h)).forEach(h => {
    const k = new Date(h.ts).toDateString();
    const v = metricaGrafico === 'carga' ? h.peso : epley(h.peso, h.reps);
    const atual = porDia.get(k);
    if(!atual || v > atual.v) porDia.set(k, {ts:h.ts, v});
  });
  return [...porDia.values()].sort((a,b) => a.ts - b.ts).slice(-12);
}
function atualizarGrafico(){
  const id = $('select-grafico').value;
  desenharGrafico(id ? pontosDoExercicio(id) : []);
  renderizarHistorico(id);
}
function desenharGrafico(pts){
  const cv = $('graficoProgressao');
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if(!w) return;
  cv.width = w*dpr; cv.height = h*dpr;
  const c = cv.getContext('2d'); c.scale(dpr, dpr); c.clearRect(0,0,w,h);
  if(!pts.length){
    c.fillStyle = '#64748b'; c.font = '12px system-ui'; c.textAlign = 'center';
    c.fillText('Registre séries de Trabalho ou Falha para ver o gráfico', w/2, h/2); return;
  }
  const pad = {l:38, r:14, t:16, b:26};
  const vals = pts.map(p => p.v);
  let min = Math.min(...vals), max = Math.max(...vals);
  if(min === max){ min -= 5; max += 5; }
  const margem = (max-min)*0.15; min -= margem; max += margem;
  const X = i => pad.l + (pts.length === 1 ? (w-pad.l-pad.r)/2 : i*(w-pad.l-pad.r)/(pts.length-1));
  const Y = v => pad.t + (1 - (v-min)/(max-min)) * (h-pad.t-pad.b);
  c.strokeStyle = '#1e293b'; c.fillStyle = '#64748b'; c.font = '10px ui-monospace,monospace'; c.lineWidth = 1; c.textAlign = 'right';
  for(let i=0;i<=3;i++){
    const v = min + (max-min)*i/3, y = Y(v);
    c.beginPath(); c.moveTo(pad.l, y); c.lineTo(w-pad.r, y); c.stroke();
    c.fillText(Math.round(v), pad.l-6, y+3);
  }
  const cor = metricaGrafico === 'carga' ? '#3b82f6' : '#10b981';
  const grad = c.createLinearGradient(0, pad.t, 0, h-pad.b);
  grad.addColorStop(0, cor + '55'); grad.addColorStop(1, cor + '00');
  if(pts.length > 1){
    c.beginPath(); c.moveTo(X(0), h-pad.b);
    pts.forEach((p,i) => c.lineTo(X(i), Y(p.v)));
    c.lineTo(X(pts.length-1), h-pad.b); c.closePath(); c.fillStyle = grad; c.fill();
    c.beginPath(); pts.forEach((p,i) => i ? c.lineTo(X(i), Y(p.v)) : c.moveTo(X(i), Y(p.v)));
    c.strokeStyle = cor; c.lineWidth = 2.5; c.lineJoin = 'round'; c.stroke();
  }
  c.textAlign = 'center';
  pts.forEach((p,i) => {
    c.beginPath(); c.arc(X(i), Y(p.v), 4, 0, 7); c.fillStyle = cor; c.fill();
    c.strokeStyle = '#0f172a'; c.lineWidth = 2; c.stroke();
    c.fillStyle = '#e2e8f0'; c.fillText(fmt(p.v), X(i), Y(p.v)-9);
    if(pts.length <= 6 || i % 2 === 0){ c.fillStyle = '#64748b'; c.fillText(dataCurta(p.ts), X(i), h-8); }
  });
}
function renderizarHistorico(id){
  const box = $('tabela-historico-exercicio');
  const regs = historico.filter(h => h.exId === id).slice(-30).reverse();
  if(!regs.length){ box.innerHTML = '<div class="vazio">Sem registros para este exercício.</div>'; return; }
  box.innerHTML = regs.map(h => `
    <div class="hrow">
      <span>${dataCurta(h.ts)} <span class="tag t${h.tipo}">${h.tipo}</span></span>
      <span class="mono">${fmt(h.peso)} kg × ${h.reps}</span>
      <span class="mono" style="color:var(--mut)">1RM ${ehValida(h) ? fmt(epley(h.peso,h.reps)) : '—'}</span>
    </div>`).join('');
}
function limparUltimoRegistroExercicio(){
  const id = $('select-grafico').value;
  for(let i = historico.length-1; i >= 0; i--){
    if(historico[i].exId === id){
      const r = historico.splice(i,1)[0];
      salvarLS('gym_hist_v3', historico);
      renderizarExercicios(); atualizarGrafico();
      mostrarToast(`Desfeito: ${fmt(r.peso)} kg × ${r.reps}`, 'background:#475569'); return;
    }
  }
  mostrarToast('Nada para desfazer', 'background:#475569');
}

// ============================ BACKUP ============================
function exportarDados(){
  const blob = new Blob([JSON.stringify({ficha:fichaTreino, historico, v:3}, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'gymtracker-backup-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  mostrarToast('Backup exportado', 'background:#059669');
}
function importarDados(ev){
  const f = ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!d.ficha || !Array.isArray(d.historico)) throw new Error('formato');
      fichaTreino = d.ficha; historico = d.historico;
      salvarLS('gym_ficha_v3', fichaTreino); salvarLS('gym_hist_v3', historico);
      selecionarTreino(treinoAtual); popularSelectGrafico(); atualizarGrafico();
      mostrarToast('Backup importado', 'background:#059669');
    }catch(e){ mostrarToast('Arquivo de backup inválido', 'background:#e11d48'); }
  };
  r.readAsText(f); ev.target.value = '';
}

// ============================ INÍCIO ============================
(function init(){
  const s = diaSugerido();
  $('dia-sugerido').textContent = s.texto;
  $('timer-display').textContent = fmtTimer(ultimoTimer);
  selecionarTreino(s.letra);
  popularSelectGrafico();
  atualizarGrafico();
  window.addEventListener('resize', atualizarGrafico);
})();
</script>
