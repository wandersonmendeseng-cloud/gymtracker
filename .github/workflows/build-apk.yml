name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: |
          npx cap add android
          npx cap sync android
      - name: Permissoes de notificacao
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          perms = ['android.permission.POST_NOTIFICATIONS','android.permission.SCHEDULE_EXACT_ALARM','android.permission.USE_EXACT_ALARM','android.permission.RECEIVE_BOOT_COMPLETED','android.permission.VIBRATE','android.permission.WRITE_EXTERNAL_STORAGE']
          add = ''.join('    <uses-permission android:name="%s" />\n' % x for x in perms if x not in s)
          s = s.replace('<application', add + '    <application', 1)
          open(p, 'w').write(s)
          print('manifest ok')
          PY
      - name: Criar icone do app
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          RES = 'android/app/src/main/res'
          DENS = {'mdpi':1, 'hdpi':1.5, 'xhdpi':2, 'xxhdpi':3, 'xxxhdpi':4}
          logo = Image.open('icon/logo_a.png').convert('RGBA')
          fgsrc = Image.open('icon/logo_fg.png').convert('RGBA')
          for nome, f in DENS.items():
              pasta = f'{RES}/mipmap-{nome}'
              fgsrc.resize((int(108*f), int(108*f)), Image.LANCZOS).save(f'{pasta}/ic_launcher_foreground.png')
              S = int(48 * f)
              logo.resize((S, S), Image.LANCZOS).save(f'{pasta}/ic_launcher.png')
              g = int(S * 1.2)
              big = logo.resize((g, g), Image.LANCZOS)
              base = Image.new('RGBA', (S, S), (15, 26, 46, 255))
              base.alpha_composite(big, ((S - g) // 2, (S - g) // 2))
              mask = Image.new('L', (S, S), 0)
              ImageDraw.Draw(mask).ellipse([0, 0, S - 1, S - 1], fill=255)
              redondo = Image.new('RGBA', (S, S), (0, 0, 0, 0))
              redondo.paste(base, (0, 0), mask)
              redondo.save(f'{pasta}/ic_launcher_round.png')
          open(f'{RES}/values/ic_launcher_background.xml', 'w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#0F1A2E</color>\n</resources>\n')
          print('icones ok')
          PY
      - working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GymTracker-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
